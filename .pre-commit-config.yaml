# Configuration for pre-commit (https://pre-commit.com)
# Run manually: pre-commit run --all-files

repos:
  # General hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key
        # Invoke via `python -m` rather than the generated detect-private-key.exe
        # entry-point stub: Windows Smart App Control blocks that stub (a
        # newly-written, unsigned small executable) in this hook's isolated
        # pre-commit venv, same cause as the mypy hook's entry override above.
        entry: python -m pre_commit_hooks.detect_private_key

  # Ruff: lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Mypy: type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        # Invoke via `python -m mypy` rather than the generated mypy.exe
        # entry-point stub: Windows Smart App Control blocks that stub
        # (a newly-written, unsigned small executable) in this hook's
        # isolated pre-commit venv, even though mypy itself runs cleanly
        # either way -- see docs/sprint7_step7_5_log.md (Hauptteil commit).
        entry: python -m mypy
        additional_dependencies:
          - pandas-stubs
          - python-dotenv
          - types-python-dateutil
          - types-requests
          - types-pytz
          - matplotlib
        args: [--config-file=pyproject.toml]
        # Only run on your source code, not tests or notebooks
        files: ^src/
